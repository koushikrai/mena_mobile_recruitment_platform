name: mena_recruitment
description: "Global Jobs By Suhana — MENA Mobile Recruitment Platform"
publish_to: 'none'
version: 1.0.3+4

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Networking
  dio: ^5.7.0
  retrofit: ^4.4.1
  web_socket_channel: ^3.0.1


  # Models & Serialization
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # UI & Design
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.16
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  lottie: ^3.3.1
  percent_indicator: ^4.2.3
  flutter_staggered_animations: ^1.1.1

  # Camera & OCR
  camera: ^0.11.0+2
  google_mlkit_text_recognition: ^0.14.0
  image_picker: ^1.1.2

  # Files & Documents
  file_picker: ^8.1.7
  open_file: ^3.5.10
  path_provider: ^2.1.5

  # Storage & Security
  flutter_secure_storage: ^9.2.4
  local_auth: ^2.3.0

  # Localization
  intl: any

  # Notifications & Analytics
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5
  firebase_analytics: ^11.4.5

  # Utilities
  connectivity_plus: ^6.1.2
  url_launcher: ^6.3.1
  cupertino_icons: ^1.0.8
  equatable: ^2.0.7
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.4.14
  freezed: ^2.5.8
  json_serializable: ^6.9.4
  riverpod_generator: ^2.6.3
  retrofit_generator: ^9.1.7

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/.env
    - assets/images/flags/
    - assets/images/icons/
    - assets/images/illustrations/
    - assets/lottie/
