name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: |
          cd mena_recruitment
          flutter pub get

      - name: Build Android Release APK
        run: |
          cd mena_recruitment
          flutter build apk --release --dart-define=API_BASE_URL=https://mena-mobile-recruitment-platform.onrender.com/api/v1 --dart-define=WS_BASE_URL=wss://mena-mobile-recruitment-platform.onrender.com/api/v1/ws

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mena-recruitment-release-apk
          path: mena_recruitment/build/app/outputs/flutter-apk/app-release.apk
